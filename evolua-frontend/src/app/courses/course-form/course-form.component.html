<h1 class="h3 fw-bold mb-4">{{ (idNumerico() === null ? 'courses.formNew' : 'courses.formEdit') | translate }}</h1>

<form class="card" style="max-width: 640px" [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
  <div class="card-body p-4">
    <app-alert [mensaje]="error()" />

    <div class="mb-3">
      <label for="nombre" class="form-label fw-semibold">{{ 'courses.name' | translate }}</label>
      <input
        id="nombre"
        type="text"
        class="form-control"
        formControlName="nombre"
        [class.is-invalid]="enviado() && formulario.controls.nombre.invalid"
        [attr.aria-invalid]="enviado() && formulario.controls.nombre.invalid"
        aria-describedby="nombre-error"
      />
      @if (enviado() && formulario.controls.nombre.invalid) {
        <div id="nombre-error" class="invalid-feedback">{{ 'courses.nameRequired' | translate }}</div>
      }
    </div>

    <div class="mb-4">
      <label for="descripcion" class="form-label fw-semibold">{{ 'courses.description' | translate }}</label>
      <textarea id="descripcion" class="form-control" rows="3" formControlName="descripcion"></textarea>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="guardando()">{{ 'common.save' | translate }}</button>
      <a class="btn btn-outline-secondary" routerLink="/courses">{{ 'common.cancel' | translate }}</a>
    </div>
  </div>
</form>
